[tool.poetry]
name = "bank_operations"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[[tool.poetry.packages]]
include = "src"

[tool.poetry.dependencies]
python = "^3.13"
flake8 = "^7.3.0"
isort = "^7.0.0"
mypy = "^1.18.2"
pandas = "^2.3.3"


[tool.poetry.group.lint.dependencies]
isort = "^7.0.0"
mypy = "^1.18.2"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '\.git|\.venv'

[tool.isort]
line_length = 119

[tool.flake8]
exclude = [".venv", "venv", ".git", "__pycache__"]
max-line-length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv']

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--cov=src",
    "--cov-report=html:htmlcov"
]
